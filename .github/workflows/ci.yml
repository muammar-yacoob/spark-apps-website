name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: muammar-yacoob/spark-ci/.github/workflows/ci.yml@main
    with:
      # On since 11 Nov 2026. This was off because 13/16 jest suites were
      # stale SparkStack boilerplate referencing modules this repo never had.
      # Those are gone: the suite runs on vitest now and passes 21/21 across
      # 8 files, so the flag was the only thing still keeping it from running.
      run-tests: true
