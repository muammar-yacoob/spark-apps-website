name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: muammar-yacoob/spark-ci/.github/workflows/ci.yml@main
    with:
      # 13/16 jest suites are stale SparkStack boilerplate referencing
      # modules this repo never had - re-enable once tests are rebuilt.
      run-tests: false
